# No bundler, no npm — the build step is one sed that stamps the commit SHA into
# the files that need to change bytes on every deploy.
[build]
  command = "sed -i \"s/__BUILD_ID__/${COMMIT_REF:-dev}/g\" sw.js script.js"
  publish = "."

# 19 KB of assets: revalidating every load costs a 304 and makes stale assets
# structurally impossible. Cheaper than getting cache invalidation wrong again.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

    # Everything is same-origin now that Bootstrap is vendored, so a strict
    # policy costs nothing. This closes the XSS class structurally instead of
    # relying on having found every innerHTML by hand.
    #   style-src unsafe-inline: index.html has one inline style attribute
    #   img-src data:           Bootstrap CSS embeds 23 inline SVG data URIs
    #                           for select arrows and close buttons
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

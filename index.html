<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e91e63">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Scaler</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Vendored rather than CDN-loaded: the app has to work offline, and a slow
       or blocked jsDelivr used to abort the whole script at parse time. -->
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- Header -->
  <nav class="navbar navbar-light bg-white shadow-sm px-3">
    <span class="navbar-brand mb-0 h1">🍳 Recipe Scaler</span>
  </nav>

  <div class="container py-3">

    <!-- Search + Dropdown -->
    <div class="mb-3">
      <div class="position-relative">
        <input type="text" id="searchInput" class="form-control mb-2" placeholder="Search recipe...">
        <button type="button" id="clearSearchBtn" class="btn btn-link text-danger position-absolute top-0 end-0 p-2 d-none" style="z-index: 10;">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <select id="recipeSelect" class="form-select"></select>
      
      <div id="searchResults" class="mt-2 d-none">
        <div id="searchResultsList" class="list-group"></div>
      </div>
    </div>

    <!-- Recipe Display -->
    <div id="recipeDisplay" class="card d-none">
      <div class="card-body">
        <h5 id="recipeName" class="card-title"></h5>
        <p><strong>Original Servings:</strong> <span id="originalServings"></span></p>
        <!-- Scaling input -->
        <div class="input-group mb-3">
          <input type="number" id="desiredServings" class="form-control" placeholder="Desired servings">
          <button class="btn btn-primary" id="scaleBtn">Scale</button>
        </div>

        <!-- Ingredients -->
        <ul id="ingredientsList" class="list-group mb-3"></ul>

        <div class="d-flex justify-content-between">
            <button id="editRecipeBtn" class="btn btn-warning">✏️ Edit</button>
            <button id="deleteRecipeBtn" class="btn btn-danger">🗑️ Delete</button>
        </div>

      </div>
    </div>

    <!-- So "are you on the new version?" is answerable without devtools -->
    <p class="text-center mt-4 mb-0"><small id="buildStamp" class="text-muted"></small></p>
  </div>

  <!-- Floating + Button -->
  <button id="addRecipeBtn" class="btn btn-primary rounded-circle shadow-lg">
    +
  </button>

  <!-- Modal: Add/Edit Recipe -->
  <div class="modal fade" id="recipeModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Recipe</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="recipeNameInput" class="form-control mb-2" placeholder="Recipe name">
          <input type="number" id="servingsInput" class="form-control mb-2" placeholder="Number of Servings">

          <div id="ingredientsFields"></div>
          <button type="button" class="btn btn-outline-secondary btn-sm mb-2" id="addIngredientFieldBtn">+ Add Ingredient</button>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="saveRecipeBtn" class="btn btn-success">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">🗑️ Delete Recipe</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Delete "<span id="deleteRecipeName"></span>"?</p>
          <p class="text-muted small">This cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
